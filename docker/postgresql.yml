services:

  database:
    container_name: postgres_container
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: calories
    ports:
      - "5432:5432"
    volumes:
      - calories-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  calories-postgres-data:
