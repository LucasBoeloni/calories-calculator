<form [formGroup]="formGroup" class="example-form">
  <mat-card class="ingredient-card">
    <mat-card-header>
      <mat-card-title>
        <mat-form-field>
          <input matInput formControlName="name" />
        </mat-form-field>
        @if(!!ingredient()){
        <button matIconButton  (click)="test()">
          <mat-icon>delete</mat-icon>
        </button>
        }

      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div class="ingredient-card-form-line">
          <p>Calorias :</p>
          <input class="ingredients-form-field" matInput formControlName="calorie" />
        </div>
        <div class="ingredient-card-form-line">
          <p>Proteinas :</p>
          <input class="ingredients-form-field" matInput formControlName="protein" />
        </div>
        <div class="ingredient-card-form-line">
          <p>Carbohidratos :</p>
          <input class="ingredients-form-field" matInput formControlName="carbohydrate" />
        </div>
        <div class="ingredient-card-form-line">
          <p>Açucares :</p>
          <input class="ingredients-form-field" matInput formControlName="sugar" />
        </div>
        <div class="ingredient-card-form-line">
          <p>Gorduras :</p>
          <input class="ingredients-form-field" matInput formControlName="fat" />
        </div>
        <div class="ingredient-card-form-line">
          <p>Fibras :</p>
          <input class="ingredients-form-field" matInput formControlName="fiber" />
        </div>
        <div class="ingredient-card-form-line">
          <p>Sódio :</p>
          <input class="ingredients-form-field" matInput formControlName="sodium" />
        </div>
    </mat-card-content>
  </mat-card>
</form>
